<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESQL Console</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --borde: #30363d;
    --texto: #c9d1d9; --tenue: #8b949e;
    --verde: #7ee787; --azul: #79c0ff; --rosa: #ff7b72; --amarillo: #d29922; --violeta: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--texto);
    font: 14px/1.55 "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--borde); background: var(--panel);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: baseline; gap: 12px; }
  header b { color: var(--verde); letter-spacing: .5px; }
  header span { color: var(--tenue); font-size: 12px; }
  .badge {
    padding: 2px 8px; border-radius: 4px; font-size: 11px;
    letter-spacing: .3px; font-weight: 500;
  }
  .badge-ok { color: var(--verde); border: 1px solid rgba(126, 231, 135, 0.4); background: rgba(126, 231, 135, 0.08); }
  .badge-warn { color: var(--amarillo); border: 1px solid rgba(210, 153, 34, 0.4); background: rgba(210, 153, 34, 0.08); }
  
  #salida { flex: 1; overflow-y: auto; padding: 16px; white-space: pre-wrap; word-break: break-word; }
  #salida > div { margin-bottom: 4px; }
  .eco { color: var(--tenue); }
  .eco b { color: var(--verde); font-weight: normal; }
  .error { color: var(--rosa); }
  .ok { color: var(--verde); }
  .sql { color: var(--azul); }
  .info { color: var(--tenue); }
  .etiqueta { color: var(--violeta); }
  
  table { border-collapse: collapse; margin: 6px 0 10px; font-size: 13px; }
  th, td { border: 1px solid var(--borde); padding: 4px 10px; text-align: left; }
  th { color: var(--tenue); font-weight: normal; background: var(--panel); }
  td.tipo { color: var(--amarillo); }
  td.valor { color: var(--azul); }

  .tabla-datos-container {
    max-width: 100%;
    overflow-x: auto;
    margin: 6px 0 12px;
  }
  table.tabla-datos {
    border-collapse: collapse;
    margin: 0;
    font-size: 13px;
    min-width: 320px;
  }
  table.tabla-datos th {
    background: #21262d;
    color: var(--verde);
    font-weight: 600;
    padding: 5px 12px;
    border: 1px solid var(--borde);
    white-space: nowrap;
  }
  table.tabla-datos td {
    border: 1px solid var(--borde);
    padding: 5px 12px;
    color: var(--texto);
    white-space: nowrap;
  }
  table.tabla-datos tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.02);
  }
  table.tabla-datos tr:hover td {
    background: rgba(121, 192, 255, 0.07);
  }

  form { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
         border-top: 1px solid var(--borde); background: var(--panel); }
  form b { color: var(--verde); }
  input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--texto); font: inherit; caret-color: var(--verde);
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <b>ESQL</b>
    <span>consola interactiva &mdash; escribe <code>ayuda</code> para ver los comandos</span>
  </div>
  <div id="db-badge" class="badge badge-warn">DB: Conectando...</div>
</header>

<div id="salida"></div>

<form id="prompt" autocomplete="off">
  <b>ESQL&gt;</b>
  <input id="entrada" spellcheck="false" autofocus placeholder="selecciona nombre, edad de la tabla usuarios">
</form>

<script>
const salida = document.getElementById('salida');
const entrada = document.getElementById('entrada');
const dbBadge = document.getElementById('db-badge');
const historial = [];
let cursor = 0;

const escapar = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function escribir(html, clase = '') {
  const linea = document.createElement('div');
  if (clase) linea.className = clase;
  linea.innerHTML = html;
  salida.appendChild(linea);
  salida.scrollTop = salida.scrollHeight;
}

function tablaTokens(tokens) {
  const filas = tokens.map((t, i) =>
    `<tr><td>${i}</td><td class="tipo">${escapar(t.tipo)}</td><td class="valor">${t.valor === null ? '&mdash;' : escapar(t.valor)}</td></tr>`
  ).join('');
  escribir(`<table><tr><th>#</th><th>tipo</th><th>valor</th></tr>${filas}</table>`);
}

function tablaDatos(datos) {
  if (!datos.filas || datos.filas.length === 0) {
    escribir('<span class="info">&rarr; Consulta ejecutada: 0 registros encontrados.</span>');
    return;
  }
  const ths = datos.columnas.map(c => `<th>${escapar(c)}</th>`).join('');
  const trs = datos.filas.map(fila => {
    const tds = datos.columnas.map(col => {
      const val = fila[col];
      const txt = (val === null || val === undefined) ? '&mdash;' : escapar(val);
      return `<td>${txt}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');

  escribir(`<div class="tabla-datos-container"><table class="tabla-datos"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`);
}

async function actualizarEstadoDB() {
  try {
    const st = await fetch('/db/estado').then(x => x.json());
    if (st.conectado) {
      dbBadge.textContent = `● PostgreSQL: Conectado (${st.servidor})`;
      dbBadge.className = 'badge badge-ok';
    } else {
      dbBadge.textContent = `○ PostgreSQL: Desconectado`;
      dbBadge.className = 'badge badge-warn';
    }
    return st;
  } catch (e) {
    dbBadge.textContent = `○ DB Error de Red`;
    dbBadge.className = 'badge badge-warn';
    return { conectado: false, error: e.message };
  }
}

const AYUDA = `Modos de salida (palabra clave opcional al inicio de la sentencia):
  <span class="etiqueta">tokens:</span> &lt;consulta&gt;   solo el listado de tokens
  <span class="etiqueta">sql:</span> &lt;consulta&gt;      solo el SQL generado
  <span class="etiqueta">regla:</span> &lt;consulta&gt;    solo la regla sintáctica aplicada
  <span class="etiqueta">datos:</span> &lt;consulta&gt;    solo los registros devueltos de la BD
  sin prefijo            respuesta completa (tokens + regla + SQL + datos reales)

La consulta acepta el formato <span class="etiqueta">peticion = &lt;consulta&gt;</span> o directa.

Comandos de la consola:
  <span class="etiqueta">ayuda</span>     esta guía
  <span class="etiqueta">reglas</span>    gramática soportada por el compilador
  <span class="etiqueta">db</span>        verificar estado de conexión con PostgreSQL
  <span class="etiqueta">ejemplos</span>  sentencias de muestra listas para probar
  <span class="etiqueta">limpiar</span>   limpiar pantalla

Ejemplo:  <span class="sql">consulta nombre y correo de la tabla clientes</span>`;

const EJEMPLOS = [
  'selecciona nombre, edad de la tabla usuarios',
  'consulta nombre y correo de la tabla clientes',
  'muestra salario y puesto de la tabla empleados',
  'selecciona nombre, precio, stock de la tabla productos',
  'muestra salario de la tabla empleados donde edad > 25',
  'lista id de la tabla pedidos ordenar por total',
  'obten nombre de la tabla usuarios activos',
];

async function reglas() {
  const r = await fetch('/reglas').then((x) => x.json());
  escribir(`Gramática: ${r.total} reglas`, 'info');
  r.reglas.forEach((x) => escribir(`  ${String(x.id).padStart(2)}. ${escapar(x.nombre)} <span class="info">&mdash; ${escapar(x.descripcion)}</span>`));
}

async function ejecutar(codigo) {
  let r;
  try {
    r = await fetch('/iniciar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo }),
    }).then((x) => x.json());
  } catch (e) {
    return escribir(`[Error de red] ${escapar(e.message)}`, 'error');
  }

  if (!r.exito) {
    return escribir(`[Error ${escapar(r.fase || '')}] ${escapar(r.error)}`, 'error');
  }
  if (r.tokens) {
    escribir(`Tokens (${r.tokens.length}):`, 'info');
    tablaTokens(r.tokens);
  }
  if (r.regla) {
    escribir(`[OK] Regla ${r.regla_id ?? ''}: ${escapar(r.regla)}`, 'ok');
  }
  if (r.resultado) {
    escribir(`SQL Generado: <span class="sql">${escapar(r.resultado)}</span>`);
  }
  if (r.datos) {
    if (r.datos.exito) {
      escribir(`Resultados en PostgreSQL (${r.datos.total} fila${r.datos.total === 1 ? '' : 's'}):`, 'ok');
      tablaDatos(r.datos);
    } else if (r.datos.error) {
      escribir(`[Aviso Base de Datos]: ${escapar(r.datos.error)}`, 'error');
    }
  }
}

document.getElementById('prompt').addEventListener('submit', async (e) => {
  e.preventDefault();
  const codigo = entrada.value.trim();
  entrada.value = '';
  if (!codigo) return;

  historial.push(codigo);
  cursor = historial.length;
  escribir(`<b>ESQL&gt;</b> ${escapar(codigo)}`, 'eco');

  const cmd = codigo.toLowerCase();
  if (cmd === 'limpiar' || cmd === 'clear' || cmd === 'cls') return (salida.innerHTML = '');
  if (cmd === 'ayuda' || cmd === 'help' || cmd === '?') return escribir(AYUDA, 'info');
  if (cmd === 'reglas') return reglas();
  if (cmd === 'db' || cmd === 'estado') {
    const st = await actualizarEstadoDB();
    if (st.conectado) {
      return escribir(`[PostgreSQL OK] Conectado exitosamente en: ${escapar(st.servidor)}`, 'ok');
    } else {
      return escribir(`[PostgreSQL Desconectado] ${escapar(st.error || 'No disponible')}`, 'error');
    }
  }
  if (cmd === 'ejemplos') {
    escribir('Sentencias de ejemplo:', 'info');
    return EJEMPLOS.forEach((x) => escribir(`  <span class="sql">${escapar(x)}</span>`));
  }
  await ejecutar(codigo);
});

entrada.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  cursor = Math.min(historial.length, Math.max(0, cursor + (e.key === 'ArrowUp' ? -1 : 1)));
  entrada.value = historial[cursor] ?? '';
});

document.addEventListener('click', () => {
  if (!window.getSelection().toString()) entrada.focus();
});

escribir('Compilador de Lenguaje Natural a SQL (ESQL) &mdash; v1.0', 'ok');
escribir('Escribe <span class="etiqueta">ayuda</span> para comandos o <span class="etiqueta">ejemplos</span> para consultas de prueba.\n', 'info');
actualizarEstadoDB();
</script>
</body>
</html>
